---
layout: default
---

<article>
  <h1>{{ title }}</h1>
  <p class="post-date">
    <span>Published <time datetime="{{ page.date | date: "%Y-%m-%d" }}">{{ page.date | date: "%d %b %Y" }}</time>
    {% if updated %}
      · Updated <time datetime="{{ updated | date: "%Y-%m-%d" }}">{{ updated | date: "%d %b %Y" }}</time>
    {% endif %}</span>
    <a class="post-metadata post-reactions" data-nostr-metadata hidden aria-live="polite" aria-label="Open reactions in a Nostr app" title="Open in a Nostr app"></a>
  </p>
  {{ content }}
</article>
<script src="/nostr-tools.js" defer></script>
<script type="module" src="/post-metadata.js"></script>
