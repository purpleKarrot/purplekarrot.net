---
layout: default
---

<article>
  <h1>{{ title }}</h1>
  <p class="post-date">
    Published <time datetime="{{ page.date | date: "%Y-%m-%d" }}">{{ page.date | date: "%d %b %Y" }}</time>
    {% if updated %}
      · Updated <time datetime="{{ updated | date: "%Y-%m-%d" }}">{{ updated | date: "%d %b %Y" }}</time>
    {% endif %}
  </p>
  {{ content }}
</article>
